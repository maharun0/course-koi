name: Sync offered courses

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: vars.COURSE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Fetch and parse latest course data
        run: uv run python data/sync_courses.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- public/courses.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/courses.csv public/last_updated.json data/response.html
          git commit -m "data synced from $(date -u '+%d %B %Y, %I:%M %p') UTC"
          git push
