name: Sync offered courses

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: vars.COURSE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to an exact version: setup-uv stopped publishing floating major
      # tags after v7, so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync

      # Exit 75 (EX_TEMPFAIL) means the source was unreachable - currently a
      # Cloudflare challenge - which is not something a re-run or a code change
      # fixes. That is reported as a warning so a genuine parse/code bug (any
      # other non-zero exit) still shows up as a red run rather than being
      # lost among daily false alarms.
      - name: Fetch and parse latest course data
        id: fetch
        run: |
          set +e
          uv run python data/sync_courses.py
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "source_unavailable=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Course sync skipped::Source page is unreachable (Cloudflare challenge). Keeping the last good data."
            exit 0
          fi
          exit "$code"

      - name: Check for changes
        id: diff
        if: steps.fetch.outputs.source_unavailable != 'true'
        run: |
          if git diff --quiet -- public/courses.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/courses.csv public/last_updated.json data/response.html
          git commit -m "data synced from $(date -u '+%d %B %Y, %I:%M %p') UTC"
          git push
